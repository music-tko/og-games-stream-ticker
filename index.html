<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The OG Games - Live Ticker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: transparent;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: flex-end;
    }

    /* Solid minimal broadcast bar with poster-matching cyber gradients */
    .ticker-bar {
      width: 100%;
      height: 44px;
      background: #000000;
      border-top: 2px solid rgba(139, 92, 246, 0.5); /* Glowing violet */
      border-bottom: 2px solid #000000;
      display: flex;
      align-items: center;
      position: relative;
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.85);
    }

    /* THE OG GAMES Brand Badge */
    .ticker-badge {
      background: linear-gradient(135deg, #ec4899 0%, #a855f7 50%, #3b82f6 100%);
      color: #ffffff;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      padding: 0 16px;
      height: 100%;
      display: flex;
      align-items: center;
      border-right: 2px solid #2e1065;
      white-space: nowrap;
      z-index: 10;
      box-shadow: 4px 0 15px rgba(168, 85, 247, 0.3);
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .marquee-container {
      flex: 1;
      overflow: hidden;
      display: flex;
      align-items: center;
      height: 100%;
      position: relative;
    }

    .marquee-track {
      display: flex;
      align-items: center;
      white-space: nowrap;
      animation: scroll 32s linear infinite;
    }

    /* Basic Player Entry - Space Grotesk Font for crisp UI */
    .player-entry {
      display: inline-flex;
      align-items: center;
      height: 44px;
      padding: 0 20px;
      border-right: 1px solid #1f2937;
      background: #09090b;
      gap: 12px;
      color: #f3f4f6;
      font-family: 'Space Grotesk', sans-serif;
      transition: all 0.2s ease;
    }

    .rank {
      font-size: 0.85rem;
      font-weight: 700;
      color: #9ca3af;
      font-family: 'Orbitron', sans-serif;
    }

    .name {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .score {
      font-size: 0.9rem;
      font-weight: 700;
      font-family: 'Orbitron', sans-serif;
      color: #ffffff;
      background: #18181b;
      padding: 3px 9px;
      border-radius: 4px;
      border: 1px solid #374151;
    }

    /* 👑 1ST PLACE - Hot Pink / Purple Gradient (matches top of G) */
    .player-entry.pos-1 {
      background: linear-gradient(90deg, rgba(236, 72, 153, 0.25) 0%, rgba(168, 85, 247, 0.25) 100%);
      border-bottom: 3px solid #ec4899;
      box-shadow: inset 0 -4px 10px rgba(236, 72, 153, 0.15);
    }
    .player-entry.pos-1 .rank {
      color: #f472b6;
      text-shadow: 0 0 8px rgba(236, 72, 153, 0.6);
    }
    .player-entry.pos-1 .name {
      color: #ffffff;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
    }
    .player-entry.pos-1 .score {
      color: #ffffff;
      background: #ec4899;
      border-color: #f472b6;
      box-shadow: 0 0 8px rgba(236, 72, 153, 0.4);
    }

    /* 🥈 2ND PLACE - Purple / Magenta (matches bottom of G) */
    .player-entry.pos-2 {
      background: linear-gradient(90deg, rgba(168, 85, 247, 0.25) 0%, rgba(139, 92, 246, 0.25) 100%);
      border-bottom: 3px solid #a855f7;
    }
    .player-entry.pos-2 .rank {
      color: #c084fc;
      text-shadow: 0 0 8px rgba(168, 85, 247, 0.6);
    }
    .player-entry.pos-2 .name {
      color: #f3e8ff;
    }
    .player-entry.pos-2 .score {
      color: #ffffff;
      background: #a855f7;
      border-color: #c084fc;
    }

    /* 🥉 3RD PLACE - Cyber Blue / Teal (matches poster highlights) */
    .player-entry.pos-3 {
      background: linear-gradient(90deg, rgba(59, 130, 246, 0.25) 0%, rgba(6, 182, 212, 0.25) 100%);
      border-bottom: 3px solid #3b82f6;
    }
    .player-entry.pos-3 .rank {
      color: #60a5fa;
      text-shadow: 0 0 8px rgba(59, 130, 246, 0.6);
    }
    .player-entry.pos-3 .name {
      color: #eff6ff;
    }
    .player-entry.pos-3 .score {
      color: #ffffff;
      background: #3b82f6;
      border-color: #60a5fa;
    }

    @keyframes scroll {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(-50%);
      }
    }
  </style>
</head>
<body>

  <div class="ticker-bar">
    <div class="ticker-badge">THE OG GAMES</div>
    <div class="marquee-container">
      <div class="marquee-track" id="track"></div>
    </div>
  </div>

  <script>
    const BOARD_TOKEN = 'pfrksfhxkyrhr';
    const API_URL = `https://leaderboarded.com/api/${BOARD_TOKEN}/board/`;
    const track = document.getElementById('track');

    function createEntry(p, idx) {
      let posClass = '';
      let badge = `${idx + 1}`;
      if (idx === 0) {
        posClass = 'pos-1';
        badge = '👑 1ST';
      } else if (idx === 1) {
        posClass = 'pos-2';
        badge = '🥈 2ND';
      } else if (idx === 2) {
        posClass = 'pos-3';
        badge = '🥉 3RD';
      } else {
        badge = `#${idx + 1}`;
      }

      return `
        <div class="player-entry ${posClass}">
          <span class="rank">${badge}</span>
          <span class="name">${p.name}</span>
          <span class="score">${p.score}</span>
        </div>
      `;
    }

    function renderTicker(players) {
      if (!players || players.length === 0) return;
      const html = players.map((p, i) => createEntry(p, i)).join('');
      track.innerHTML = html + html;
    }

    async function fetchScores() {
      try {
        const res = await fetch(API_URL);
        if (!res.ok) return;

        const data = await res.json();
        const raw = data.players || data.participants || [];

        if (raw.length > 0) {
          const list = raw.map(p => ({
            name: p.name || 'Player',
            score: Number(p.score ?? 0)
          }));

          list.sort((a, b) => b.score - a.score);
          renderTicker(list);
        }
      } catch (err) {}
    }

    fetchScores();
    setInterval(fetchScores, 2000);
  </script>
</body>
</html>
